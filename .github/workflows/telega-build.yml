name: Sync and build Telega

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telega-sync-build
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Telega
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy complete upstream Telegram source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/telega-build.yml /tmp/telega-build.yml
          git clone --recursive --depth 1 --shallow-submodules https://github.com/DrKLO/Telegram.git /tmp/telegram-upstream
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/telegram-upstream/ ./
          mkdir -p .github/workflows
          cp /tmp/telega-build.yml .github/workflows/telega-build.yml

      - name: Set visible app name to Telega
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("TMessagesProj/src/main/AndroidManifest.xml")]
          candidates += list(Path("TMessagesProj/src/main/res").glob("values*/strings.xml"))
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'(<string\s+name="(?:AppName|app_name|app_name_short)"[^>]*>)[^<]*(</string>)', r'\1Telega\2', text)
              text = re.sub(r'android:label="Telegram"', 'android:label="Telega"', text)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit copied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import upstream Telegram Android source for Telega"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          chmod +x gradlew

      - name: Build standalone APK
        run: ./gradlew --no-daemon --stacktrace assembleStandalone

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-APK
          path: TMessagesProj/build/outputs/apk/standalone/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          TAG="telega-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$APK#Telega APK" --title "Telega build $TAG" --notes "Automated APK build from upstream Telegram Android source. GPL license and source are included in this repository."
