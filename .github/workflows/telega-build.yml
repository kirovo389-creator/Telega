name: Sync and build Telega

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telega-build.yml'

permissions:
  contents: write

concurrency:
  group: telega-sync-build
  cancel-in-progress: true

jobs:
  sync-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ChatMessageCell and apply soft-delete UI
        run: |
          set -euo pipefail
          GOOD_COMMIT="e0956597f8657b7b503b3d7ff0f71bd8247909ac"
          TARGET="TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"

          echo "Restoring $TARGET from $GOOD_COMMIT"
          git show "${GOOD_COMMIT}:${TARGET}" > "$TARGET"
          test -s "$TARGET"
          echo "Restored size: $(wc -c < "$TARGET")"

          python3 scripts/patch_soft_delete.py

      - name: Set app name to Telega
        run: |
          python3 -c '
          from pathlib import Path
          import re
          for p in [Path("TMessagesProj/src/main/AndroidManifest.xml")] + list(Path("TMessagesProj/src/main/res").glob("values*/strings.xml")):
              if not p.exists(): continue
              t = p.read_text(encoding="utf-8")
              t = re.sub(r"(<string\\s+name=\"(?:AppName|app_name|app_name_short)\"[^>]*>)[^<]*(</string>)", r"\\1Telega\\2", t)
              t = re.sub(r"android:label=\"Telegram\"", "android:label=\"Telega\"", t)
              p.write_text(t, encoding="utf-8")
          print("App name set to Telega")
          '

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses || true
          chmod +x gradlew

      - name: Build standalone APK
        run: ./gradlew --no-daemon --stacktrace assembleStandalone

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-APK
          path: TMessagesProj/build/outputs/apk/standalone/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          TAG="telega-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$APK#Telega APK" \
            --title "Telega $TAG" \
            --notes "Soft-deleted messages stay visible with mild transparency (0.85) and red label «Удалено». Source and GPL included."
