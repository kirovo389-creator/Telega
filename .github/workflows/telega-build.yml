name: Sync and build Telega

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telega-build.yml'
      - 'gradle.properties'
      - 'TMessagesProj/google-services.json'
      - 'TMessagesProj/config/**/AndroidManifest*.xml'
      - 'TMessagesProj/src/main/AndroidManifest.xml'
      - 'TMessagesProj_App/build.gradle'
      - 'scripts/telega_brand.py'
      - 'scripts/**'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Telega*.java'
      - 'TMessagesProj/src/main/java/org/telegram/messenger/Telega*.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Components/TelegaSnowView.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Components/TelegaVideoWallpaperView.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Components/TelegaAvatarFrameView.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/ProxyListActivity.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Adapters/DialogsAdapter.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/TelegaLocalBypassSettingsActivity.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java'
      - 'TMessagesProj/src/main/java/org/telegram/ui/WallpapersListActivity.java'
      - 'TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java'
      - 'TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java'
      - 'TMessagesProj/src/main/res/drawable/telega_ic_*.xml'

permissions:
  contents: write

concurrency:
  group: telega-sync-build-v2
  cancel-in-progress: true

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Slim Gradle modules
        run: |
          set -euo pipefail
          cat > settings.gradle << 'EOF'
          include ':TMessagesProj'
          include ':TMessagesProj_App'
          include ':jlatexmath'
          project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
          apply from: file("TMessagesProj_Modules/media/core_settings.gradle")
          EOF

      - name: Patch sources
        run: |
          set -euo pipefail
          python3 scripts/patch_soft_delete.py
          python3 scripts/patch_edit_own.py || true
          python3 scripts/patch_edit_text.py
          python3 scripts/patch_ai_agent.py
          python3 scripts/patch_bugs.py
          python3 scripts/patch_proxy_autoreply.py
          python3 scripts/patch_permanent_fixes.py
          python3 scripts/patch_telega_requested_fixes.py

      - name: Verify Telega integration
        run: |
          set -euo pipefail
          CHAT_CELL="TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"
          CHAT_ACTIVITY="TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java"
          grep -Fq 'currentTimeString = org.telegram.messenger.TelegaDeletedLabel.label();' "$CHAT_CELL"
          grep -Fq 'org.telegram.messenger.TelegaGarland.draw(canvas, this,' "$CHAT_CELL"
          grep -Fq 'org.telegram.messenger.TelegaChatEffects.attach(fragmentView);' "$CHAT_ACTIVITY"
          grep -Fq 'TelegaSettings.SNOW_MINECRAFT' TMessagesProj/src/main/java/org/telegram/ui/TelegaCustomizationActivity.java
          grep -Fq 'TelegaSettings.SNOW_REAL' TMessagesProj/src/main/java/org/telegram/ui/TelegaCustomizationActivity.java
          grep -Fq 'TelegaSettings.SNOW_RAIN' TMessagesProj/src/main/java/org/telegram/ui/TelegaCustomizationActivity.java
          grep -Fq 'drawRain(canvas, dt)' TMessagesProj/src/main/java/org/telegram/ui/Components/TelegaSnowView.java
          grep -Fq 'TelegaSettings.setGarlandEnabled(enabled)' TMessagesProj/src/main/java/org/telegram/ui/TelegaCustomizationActivity.java
          grep -Fq 'TelegaAutoReplyAgent.ensureInitialized(a)' TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java
          grep -Fq 'TelegaSettings.isAiAutoReplyEnabled()' TMessagesProj/src/main/java/org/telegram/ui/TelegaOtherSettingsActivity.java
          grep -Fq 'TelegaLocalBypassProxy.isEnabled()' TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java
          grep -Fq 'TelegaLocalBypassProxy.start()' TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java
          grep -Fq 'TelegaSettings.setLocalBypassEnabled(enabled)' TMessagesProj/src/main/java/org/telegram/messenger/TelegaLocalBypassProxy.java
          grep -Fq 'new TelegaLocalBypassSettingsActivity()' TMessagesProj/src/main/java/org/telegram/ui/TelegaSettingsActivity.java
          grep -Fq 'canAutoReplyNow' TMessagesProj/src/main/java/org/telegram/messenger/TelegaAutoReplyAgent.java
          grep -Fq 'startOfflineReplyWorker' TMessagesProj/src/main/java/org/telegram/messenger/TelegaAutoReplyAgent.java
          grep -Fq 'flushPendingReplies' TMessagesProj/src/main/java/org/telegram/messenger/TelegaAutoReplyAgent.java
          grep -Fq 'TelegaSettings.isStoriesDisabled()' TMessagesProj/src/main/java/org/telegram/ui/Stories/StoriesUtilities.java
          grep -Fq 'persistLocalProxy' TMessagesProj/src/main/java/org/telegram/messenger/TelegaLocalBypassProxy.java
          grep -Fq 'proxy_enabled' TMessagesProj/src/main/java/org/telegram/messenger/TelegaLocalBypassProxy.java
          grep -Fq 'SharedConfig.currentProxy' TMessagesProj/src/main/java/org/telegram/messenger/TelegaLocalBypassProxy.java
          grep -Fq 'proxySettingsChanged' TMessagesProj/src/main/java/org/telegram/messenger/TelegaLocalBypassProxy.java
          grep -Fq 'isLoopbackProxyAddress' TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java
          grep -Fq 'TelegaSettings.SNOW_STARS' TMessagesProj/src/main/java/org/telegram/ui/TelegaCustomizationActivity.java
          grep -Fq 'drawStars(canvas, dt, now)' TMessagesProj/src/main/java/org/telegram/ui/Components/TelegaSnowView.java
          grep -Fq 'TelegaSettings.isGlassChatsEnabled()' TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          grep -Fq 'setTelegaLocalEditMessage(target' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'telegaLocalEditMode' TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java
          grep -Fq 'TelegaSettings.isArchiveHidden() && dialogsType == DIALOGS_TYPE_DEFAULT' TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java
          grep -Fq 'suppressArchivedNotifications' TMessagesProj/src/main/java/org/telegram/messenger/NotificationsController.java
          grep -Fq 'TelegaGlassDialogs.draw(canvas, this' TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          grep -Fq 'TelegaProfileColor' TMessagesProj/src/main/java/org/telegram/messenger/TelegaProfileColor.java
          grep -Fq 'Палитра' TMessagesProj/src/main/java/org/telegram/ui/TelegaProfileSettingsActivity.java
          grep -Fq 'TelegaProfileColor' TMessagesProj/src/main/java/org/telegram/ui/Components/AvatarDrawable.java
          grep -Fq 'DEFAULT_PORT = 56626' TMessagesProj/src/main/java/org/telegram/messenger/TelegaLocalBypassProxy.java
          grep -Fq 'pickDialogsWallpaper()' TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java
          grep -Fq 'TelegaDialogWallpaper.createDrawable(context' TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java
          grep -Fq 'TelegaSettings.getDialogsWallpaperPath()' TMessagesProj/src/main/java/org/telegram/messenger/TelegaDialogWallpaper.java
          grep -Fq 'OPTION_TELEGA_LOCAL_EDIT' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'TelegaLocalMessageEdits.getTextForLayout(this)' TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          grep -Fq 'TelegaSettings.isAntiBotEnabled()' TMessagesProj/src/main/java/org/telegram/ui/Adapters/DialogsAdapter.java
          grep -Fq 'TelegaSettings.isAntiBotEnabled()' TMessagesProj/src/main/java/org/telegram/messenger/NotificationsController.java
          grep -Fq 'new TelegaAntiBotSettingsActivity()' TMessagesProj/src/main/java/org/telegram/ui/TelegaSettingsActivity.java
          grep -Fq 'Telega auth.sendCode failed without server error text' TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java
          grep -Fq 'API_ID_PUBLISHED_FLOOD' TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java
          echo "Wallpaper picker, local message edits, anti-bot, and explicit login error handling verified."

      - name: Branding package version icon
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil python3-pil.imagetk || true
          VERSION_CODE=$(date -u +%s)
          VERSION_NAME="13.0.8-telega.$(date -u +%Y%m%d-%H%M)"
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${VERSION_CODE}/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${VERSION_NAME}/" gradle.properties
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=org.telega.messenger/' gradle.properties
          python3 scripts/telega_brand.py
          grep -E 'APP_PACKAGE|APP_VERSION' gradle.properties


      - name: Verify Telega package identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          props = {}
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  key, value = line.split("=", 1)
                  props[key.strip()] = value.strip()
          assert props.get("APP_PACKAGE") == "org.telega.messenger", props.get("APP_PACKAGE")

          data = json.loads(Path("TMessagesProj/google-services.json").read_text(encoding="utf-8"))
          packages = {c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in data.get("client", [])}
          expected = {"org.telega.messenger", "org.telega.messenger.beta", "org.telega.messenger.web"}
          missing = expected - packages
          if missing:
              raise SystemExit("Missing Google Services clients: " + ", ".join(sorted(missing)))

          manifests = [
              "TMessagesProj/src/main/AndroidManifest.xml",
              "TMessagesProj/config/debug/AndroidManifest.xml",
              "TMessagesProj/config/debug/AndroidManifest_SDK23.xml",
              "TMessagesProj/config/release/AndroidManifest.xml",
              "TMessagesProj/config/release/AndroidManifest_SDK23.xml",
              "TMessagesProj/config/release/AndroidManifest_standalone.xml",
          ]
          for name in manifests:
              source = Path(name).read_text(encoding="utf-8")
              match = re.search(r"<service\b[^>]*GcmPushListenerService[^>]*>", source, re.S)
              if match and 'android:exported="false"' not in match.group(0):
                  raise SystemExit(f"GcmPushListenerService must be non-exported: {name}")
          print("Telega application ID, Firebase variant IDs, and push service export flags verified.")
          PY

      - name: Configure Telegram API credentials
        env:
          TELEGA_API_ID: ${{ secrets.TELEGA_API_ID || secrets.TELEGRAM_API_ID || secrets.APP_ID }}
          TELEGA_API_HASH: ${{ secrets.TELEGA_API_HASH || secrets.TELEGRAM_API_HASH || secrets.APP_HASH }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGA_API_ID}" ] && [ -z "${TELEGA_API_HASH}" ]; then
            echo "::warning::Telegram API credentials are not configured. This APK can compile, but the upstream sample API ID is not suitable for reliable real-user login."
            exit 0
          fi
          if [ -z "${TELEGA_API_ID}" ] || [ -z "${TELEGA_API_HASH}" ]; then
            echo "::error::Both TELEGA_API_ID and TELEGA_API_HASH (or their aliases) must be configured together."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          api_id = os.environ["TELEGA_API_ID"].strip()
          api_hash = os.environ["TELEGA_API_HASH"].strip()
          if not re.fullmatch(r"[0-9]+", api_id):
              raise SystemExit("TELEGA_API_ID must contain digits only")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              raise SystemExit("TELEGA_API_HASH must be exactly 32 hexadecimal characters")

          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = path.read_text(encoding="utf-8")
          source, ids = re.subn(
              r"public\s+static\s+int\s+APP_ID\s*=\s*\d+\s*;",
              f"public static int APP_ID = {api_id};",
              source,
          )
          source, hashes = re.subn(
              r'public\s+static\s+String\s+APP_HASH\s*=\s*"[^"]*"\s*;',
              f'public static String APP_HASH = "{api_hash}";',
              source,
          )
          if ids != 1 or hashes != 1:
              raise SystemExit(f"Expected one APP_ID and one APP_HASH field; found {ids} and {hashes}")
          path.write_text(source, encoding="utf-8")
          print("Telegram API credentials injected from GitHub Secrets; values were not logged.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
            ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "ndk;27.2.12479018" "cmake;3.22.1" || true
          chmod +x gradlew || true

      - name: Build APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ./gradlew --no-daemon --parallel --build-cache \
            :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj_App -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Telega.apk
          TAG="telega-$(date -u +%Y%m%d-%H%M%S)"
          VER=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          gh release create "$TAG" "Telega.apk#Telega.apk" \
            --title "Telega $TAG (v$VER)" \
            --notes "• Прокси как MordaTG: mainconfig + SharedConfig + proxyCheckDone\n• Цвет профиля реально в AvatarDrawable\n• Автоответчик flushPendingReplies"
