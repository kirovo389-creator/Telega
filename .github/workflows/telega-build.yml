name: Sync and build Telega

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telega-sync-build
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Telega
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build the committed Telega source as-is. Source syncing is intentionally disabled
      # so custom Telega changes are not overwritten before a manual build.

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          chmod +x gradlew

      - name: Build standalone APK
        run: ./gradlew --no-daemon --stacktrace assembleStandalone

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-APK
          path: TMessagesProj/build/outputs/apk/standalone/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          TAG="telega-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$APK#Telega APK" --title "Telega build $TAG" --notes "Automated APK build from upstream Telegram Android source. GPL license and source are included in this repository."
