name: Sync and build Telega

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telega-build.yml'

permissions:
  contents: write

concurrency:
  group: telega-sync-build
  cancel-in-progress: true

jobs:
  sync-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ChatMessageCell and apply soft-delete UI
        run: |
          set -euo pipefail
          GOOD_COMMIT="e0956597f8657b7b503b3d7ff0f71bd8247909ac"
          TARGET="TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"

          echo "Restoring $TARGET from $GOOD_COMMIT"
          git show "${GOOD_COMMIT}:${TARGET}" > "$TARGET"
          test -s "$TARGET"
          echo "Restored size: $(wc -c < "$TARGET")"

          python3 scripts/patch_soft_delete.py

      - name: Set unique package, app name and rising version (Telega)
        run: |
          set -euo pipefail

          # Must fit in signed 32-bit int (max 2147483647).
          # YYMMDDHHMM overflows; use unix timestamp (~1.76e9 in 2026) — always rising.
          VERSION_CODE=$(date -u +%s)
          VERSION_NAME="13.0.3-telega.$(date -u +%Y%m%d-%H%M)"
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${VERSION_CODE}/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${VERSION_NAME}/" gradle.properties
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=org.telega.messenger/' gradle.properties
          grep -E 'APP_PACKAGE|APP_VERSION' gradle.properties

          python3 - <<'PY'
          from pathlib import Path
          import re, json, copy

          NEW_PKG = "org.telega.messenger"
          OLD_PKG = "org.telegram.messenger"

          for p in [Path("TMessagesProj/src/main/AndroidManifest.xml")] + list(Path("TMessagesProj/src/main/res").glob("values*/strings.xml")):
              if not p.exists():
                  continue
              t = p.read_text(encoding="utf-8")
              t = re.sub(
                  r'(<string\s+name="(?:AppName|app_name|app_name_short)"[^>]*>)[^<]*(</string>)',
                  r'\1Telega\2',
                  t,
              )
              t = re.sub(r'android:label="Telegram"', 'android:label="Telega"', t)
              p.write_text(t, encoding="utf-8")

          for p in Path(".").rglob("google-services.json"):
              if "build" in p.parts:
                  continue
              data = json.loads(p.read_text(encoding="utf-8"))
              clients = data.get("client", [])
              existing = set()
              base = None
              for c in clients:
                  pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name")
                  if pkg:
                      existing.add(pkg)
                  if pkg == OLD_PKG:
                      base = c
              if NEW_PKG not in existing and base is not None:
                  extra = copy.deepcopy(base)
                  extra["client_info"]["android_client_info"]["package_name"] = NEW_PKG
                  clients.append(extra)
                  data["client"] = clients
                  p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
                  print("added telega client to", p)
              else:
                  print("ok", p, "packages:", sorted(existing))

          for p in [
              Path("TMessagesProj_App/src/main/AndroidManifest.xml"),
              Path("TMessagesProj/src/main/AndroidManifest.xml"),
          ]:
              if not p.exists():
                  continue
              t = p.read_text(encoding="utf-8")
              t2 = t
              if OLD_PKG in t2:
                  t2 = t2.replace(f'{OLD_PKG}.provider', f'{NEW_PKG}.provider')
                  t2 = t2.replace(f'{OLD_PKG}.passthrough', f'{NEW_PKG}.passthrough')
                  t2 = t2.replace(f'{OLD_PKG}.channel_content', f'{NEW_PKG}.channel_content')
                  t2 = t2.replace(f'{OLD_PKG}.notification', f'{NEW_PKG}.notification')
              if t2 != t:
                  p.write_text(t2, encoding="utf-8")
                  print("updated authorities in", p)

          print("Package set to", NEW_PKG)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Downloading cmdline-tools..."
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
            ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" || true

          chmod +x gradlew || true
          echo "SDK setup done"

      - name: Build APK (afatRelease)
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          grep -E 'APP_PACKAGE|APP_VERSION' gradle.properties
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-APK
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj_App TMessagesProj -type f -name '*.apk' 2>/dev/null | head -n 1)"
          test -n "$APK"
          echo "Found APK: $APK"
          cp "$APK" Telega.apk
          TAG="telega-$(date -u +%Y%m%d-%H%M%S)"
          VER=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          gh release create "$TAG" "Telega.apk#Telega.apk" \
            --title "Telega $TAG (v$VER)" \
            --notes "Telega (org.telega.messenger) versionCode $VER\n\n• Soft-delete «Удалено»\n• Настройки Telega → Сообщения\n• История правок со стрелкой и анимацией"
