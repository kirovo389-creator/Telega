name: Cleanup unused modules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unused modules and files
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch -q \
            TMessagesProj_AppStandalone \
            TMessagesProj_AppHuawei \
            TMessagesProj_AppHockeyApp \
            TMessagesProj_AppTests \
            Tools \
            Dockerfile \
            apkdiff.py \
            apkfrombundle.py
          git status --short | tail -n 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove modules not used by the main APK build (Standalone, Huawei, HockeyApp, Tests, Tools) [skip ci]"
          git push
