name: Build Telega APK
# Default push builds the regular Telega release; Beta is opt-in only.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: "main"
        type: string
      build_mode:
        description: "Application build mode"
        required: true
        default: "telega"
        type: choice
        options:
          - telega
          - beta

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Select application build mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ inputs.build_mode || 'telega' }}"
          if [ "$MODE" = "beta" ]; then
            echo "gradle_task=assembleAfatDebug" >> "$GITHUB_OUTPUT"
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "apk_name=Telega-Beta.apk" >> "$GITHUB_OUTPUT"
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_task=assembleAfatRelease" >> "$GITHUB_OUTPUT"
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "apk_name=Telega.apk" >> "$GITHUB_OUTPUT"
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Telega application identity
        run: |
          set -euo pipefail
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=org.telega.messenger/' gradle.properties
          python3 scripts/telega_brand.py
          grep -Fxq 'APP_PACKAGE=org.telega.messenger' gradle.properties
          grep -Fq '"package_name": "org.telega.messenger.beta"' TMessagesProj/google-services.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;27.2.12479018" "build-tools;36.0.0" "platforms;android-36" "cmake;3.22.1"

      - name: Build selected APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ":TMessagesProj_App:${{ steps.mode.outputs.gradle_task }}"

      - name: Verify and prepare APK for distribution
        env:
          BUILD_TYPE: ${{ steps.mode.outputs.build_type }}
          APK_NAME: ${{ steps.mode.outputs.apk_name }}
        run: |
          set -euo pipefail
          APK_PATH="$(find TMessagesProj_App/build/outputs/apk -type f -path "*/afat/$BUILD_TYPE/*.apk" | sort | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK was not produced for $BUILD_TYPE"
            find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK_PATH" "$APK_NAME"
          test -s "$APK_NAME"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK_NAME"

      - name: Validate APK package metadata and alignment
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging Telega.apk | tee apk-badging.txt
          grep -F "package: name='org.telega.messenger'" apk-badging.txt
          grep -F "sdkVersion:'23'" apk-badging.txt
          "$ZIPALIGN" -c -v 4 Telega.apk
          "$APKSIGNER" verify --verbose --print-certs Telega.apk

      # GitHub-hosted emulator boot can remain in ADB "offline" state indefinitely.
      # Package metadata, ZIP alignment and APK signature are validated above.
      # Do not make release publication depend on an unreliable hosted emulator.
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-${{ steps.mode.outputs.build_type }}-universal
          path: ${{ steps.mode.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telega-build-${{ github.run_number }}
          name: ${{ steps.mode.outputs.is_beta == 'true' && 'Telega Beta' || 'Telega' }} build ${{ github.run_number }}
          body: |
            Automated universal ${{ steps.mode.outputs.build_type }} APK build.
            Application ID: ${{ steps.mode.outputs.is_beta == 'true' && 'org.telega.messenger.beta' || 'org.telega.messenger' }}
            Source commit: ${{ github.sha }}
          files: ${{ steps.mode.outputs.apk_name }}
          prerelease: ${{ steps.mode.outputs.is_beta }}
