name: Build Telega APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: "feature/max-settings-handoff"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "build-tools;36.0.0" "platforms;android-36"

      - name: Build universal debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleBundleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telega-debug-universal
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
