name: Build Telega APK

on:
  push:
    branches:
      - 'fix/**'
    paths:
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;27.2.12479018" "build-tools;36.0.0" "platforms;android-36" "cmake;3.22.1"

      - name: Build universal debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telega-debug-universal
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
