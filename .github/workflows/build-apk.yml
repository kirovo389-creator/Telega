name: Build Telega APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Prepare Telega application identity
        run: |
          set -euo pipefail
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=org.telega.messenger/' gradle.properties
          python3 scripts/telega_brand.py
          grep -Fxq 'APP_PACKAGE=org.telega.messenger' gradle.properties
          grep -Fq '"package_name": "org.telega.messenger.beta"' TMessagesProj/google-services.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;27.2.12479018" "build-tools;36.0.0" "platforms;android-36" "cmake;3.22.1"

      - name: Build universal debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Prepare APK for distribution
        run: |
          set -euo pipefail
          APK_PATH="$(find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK was not produced"
            exit 1
          fi
          cp "$APK_PATH" Telega-universal-debug.apk
          test -s Telega-universal-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-debug-universal
          path: Telega-universal-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telega-build-${{ github.run_number }}
          name: Telega APK build ${{ github.run_number }}
          body: |
            Automated universal debug APK build.
            Source commit: ${{ github.sha }}
          files: Telega-universal-debug.apk
          prerelease: true
